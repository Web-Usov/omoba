schema: spec-driven

context: |
  Open MOBA — platform-first модифицируемая multiplayer game platform.
  Git является source of truth для product intent, specifications, architecture decisions, code и tests.
  Официальная/reference game должна использовать тот же публичный Mod API, который доступен внешним creators.
  Canonical project documentation, OpenSpec artifacts и ADR ведутся на русском; filenames, code/API identifiers, CLI commands и schema keys сохраняются на английском.
  Предпочитай machine-verifiable requirements и acceptance criteria везде, где это практично.
  Сохраняй server authority и separation of simulation from presentation, если принятый ADR явно не меняет эти принципы.
  Перед планированием architecture-impacting work прочитай docs/vision/principles.md, docs/architecture/overview.md, relevant ADRs и current specs.

rules:
  proposal:
    - Сосредоточь proposal на том, зачем нужен change и какой outcome требуется.
    - Обязательно укажи Scope и Non-goals.
    - Определи affected capabilities и необходимость нового или обновлённого ADR.
    - Не вводи новые product или architecture decisions молча.

  specs:
    - Описывай observable behavior и system guarantees, а не implementation details, если сама boundary не является requirement.
    - Используй однозначные нормативные формулировки; при необходимости сохраняй устоявшиеся MUST, SHALL, SHOULD и MUST NOT.
    - Делай scenarios конкретными и testable; Given/When/Then допустим там, где это повышает ясность.
    - Для networking, modding, persistence и public API changes покрывай relevant failure, security, concurrency и compatibility cases.

  design:
    - Явно фиксируй system boundaries, invariants, interfaces, data flow и ownership.
    - Указывай рассмотренные alternatives и объясняй выбор подхода.
    - "Включай verification strategy: tests, simulations, benchmarks или tooling по ситуации."
    - Ссылайся на существующие ADR. Если требуется новое фундаментальное решение, пометь ADR required вместо маскировки решения под implementation detail.
    - По возможности отделяй engine/platform decisions от правил reference game.

  tasks:
    - Разбивай работу на небольшие ordered tasks, которые по возможности можно реализовать и проверить независимо.
    - Каждая implementation task должна включать или иметь парную verification work.
    - Предпочитай tasks, которые одна coding-agent session может завершить без широких unrelated changes.
    - Не добавляй работу за пределами approved scope только потому, что это удобно во время implementation.

operations:
  apply:
    guidance:
      - Реализуй утверждённые specification и design; не переопределяй product intent во время coding.
      - Если implementation выявляет конфликт со scope, architecture invariants, current specs или accepted ADRs, остановись и обнови change вместо импровизации.
      - Не вводи новое фундаментальное architecture decision без accepted ADR.
      - Перед завершением task запускай максимально сильную доступную automated verification.

  archive:
    guidance:
      - Архивируй change только после завершения implementation и verification.
      - Убедись, что shipped behavior отражён в current specs.
      - Зафиксируй все accepted deviations от исходного design до archive.
