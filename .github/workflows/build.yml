name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-core:
    name: .NET Core
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show tool versions
        run: |
          dotnet --info

      - name: Restore
        run: dotnet restore OpenMoba.sln

      - name: Build solution
        run: dotnet build OpenMoba.sln --no-restore --configuration Release

      - name: Build simulation without Godot binary
        run: dotnet build src/OpenMoba.Sim/OpenMoba.Sim.csproj --configuration Release

      - name: Test
        run: dotnet test OpenMoba.sln --no-build --configuration Release

      - name: Server smoke
        run: dotnet run --project src/OpenMoba.Server --configuration Release --no-build -- --smoke

  godot-headless:
    name: Godot Headless Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_ARCHIVE: "Godot_v4.7.2-stable_mono_linux_x86_64.zip"
      GODOT_DIR: "${{ github.workspace }}/.tools/godot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download official Godot Mono binary
        run: |
          mkdir -p "$GODOT_DIR"
          cd "$GODOT_DIR"
          curl -fsSL -o SHA512-SUMS.txt \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/SHA512-SUMS.txt"
          curl -fsSL -o "$GODOT_ARCHIVE" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${GODOT_ARCHIVE}"

      - name: Verify Godot archive checksum
        run: |
          cd "$GODOT_DIR"
          grep "  ${GODOT_ARCHIVE}$" SHA512-SUMS.txt > expected.sha512
          sha512sum -c expected.sha512

      - name: Extract Godot
        run: |
          cd "$GODOT_DIR"
          unzip -q "$GODOT_ARCHIVE"
          GODOT_BIN="$(find "$GODOT_DIR" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Build Godot client
        run: |
          # Editor/headless project load resolves the Debug assembly path by default.
          dotnet build src/OpenMoba.Client.Godot/OpenMoba.Client.Godot.csproj --configuration Debug
          dotnet build src/OpenMoba.Client.Godot/OpenMoba.Client.Godot.csproj --configuration Release

      - name: Run Godot headless smoke
        run: |
          set -euo pipefail
          # --quit-after bounds first-checkout import/runtime so CI cannot hang forever.
          timeout 90s "$GODOT_BIN" --headless --path src/OpenMoba.Client.Godot --quit-after 300 \
            | tee "$RUNNER_TEMP/godot-smoke.log"
          grep -F '{"component":"OpenMoba.Client.Godot","mode":"smoke","status":"ok"}' "$RUNNER_TEMP/godot-smoke.log"
